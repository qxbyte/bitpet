name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 0.0.5，对应 tag v0.0.5）'
        required: true

permissions:
  contents: write

env:
  RELEASE_BRANCH: master

defaults:
  run:
    shell: bash

jobs:
  validate-release-branch:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - name: Resolve release ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            REF="${{ github.event.release.target_commitish }}"
          else
            REF="${{ github.ref_name }}"
          fi

          if [ "$REF" != "$RELEASE_BRANCH" ]; then
            echo "::error::Releases must target $RELEASE_BRANCH, got $REF"
            exit 1
          fi

          echo "ref=$REF" >> "$GITHUB_OUTPUT"

  prepare-release:
    needs: validate-release-branch
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-event.outputs.tag || steps.dispatch.outputs.tag }}
      release_id: ${{ steps.release-event.outputs.release_id || steps.dispatch.outputs.release_id }}
    steps:
      - name: Use published release
        id: release-event
        if: github.event_name == 'release'
        run: |
          echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          echo "release_id=${{ github.event.release.id }}" >> "$GITHUB_OUTPUT"

      - name: Create release for workflow dispatch
        id: dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          V="${{ github.event.inputs.version }}"
          TAG="v${V#v}"
          gh release create "$TAG" \
            --target "${{ needs.validate-release-branch.outputs.ref }}" \
            --title "BitPet $TAG" \
            --notes "Install or update via npm:

          \`\`\`bash
          npm install -g bitpet   # first install
          npm update -g bitpet    # update
          \`\`\`" \
            --latest
          RELEASE_ID=$(gh release view "$TAG" --json databaseId -q .databaseId)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 1: Build desktop release assets ──────────────────────
  build:
    needs: [validate-release-branch, prepare-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest   # Apple Silicon (M-series), Rosetta 2 covers Intel Macs
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --target x86_64-pc-windows-msvc --bundles nsis

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Sync version from release tag into all first-party manifests before building.
      # This ensures the built app/CLI version matches the GitHub release tag.
      - name: Sync version from tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            V="${{ github.event.inputs.version }}"
            TAG="v${V#v}"
          fi
          node scripts/sync-version.js "$TAG"

      - name: Install frontend dependencies
        run: npm install

      # Attach platform assets to the release created via GitHub UI or workflow_dispatch.
      - name: Build and attach to GitHub release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release_id }}
          args: ${{ matrix.args }}

  # ── Job 2: Publish CLI to npm after release assets are uploaded ──
  publish-npm:
    needs: [validate-release-branch, prepare-release, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.tag }}

      - name: Setup Node.js with npm registry
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Sync version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ needs.prepare-release.outputs.tag }}"
          else
            TAG="${{ needs.prepare-release.outputs.tag }}"
          fi
          VER="${TAG#v}"
          node scripts/sync-version.js "$TAG"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Verify npm token is configured
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Missing NPM_TOKEN repository secret"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check npm version availability
        working-directory: cli
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION="${{ steps.version.outputs.version }}"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION already exists on npm. Bump the release version before publishing."
            exit 1
          fi

      - name: Bundle BitPet release assets
        run: |
          mkdir -p cli/assets
          gh release download "$TAG" \
            --pattern "BitPet_aarch64.app.tar.gz" \
            --dir cli/assets \
            --clobber
          test -s cli/assets/BitPet_aarch64.app.tar.gz
          gh release download "$TAG" \
            --pattern "BitPet_*setup.exe" \
            --dir cli/assets \
            --clobber
          test -n "$(find cli/assets -maxdepth 1 -name 'BitPet_*setup.exe' -print -quit)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}

      - name: Verify CLI package
        working-directory: cli
        run: |
          npm test
          npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
