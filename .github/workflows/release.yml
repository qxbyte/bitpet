name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 0.0.5，对应 tag v0.0.5）'
        required: true

permissions:
  contents: write

env:
  RELEASE_BRANCH: master

jobs:
  validate-release-branch:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - name: Resolve release ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            REF="${{ github.event.release.target_commitish }}"
          else
            REF="${{ github.ref_name }}"
          fi

          if [ "$REF" != "$RELEASE_BRANCH" ]; then
            echo "::error::Releases must target $RELEASE_BRANCH, got $REF"
            exit 1
          fi

          echo "ref=$REF" >> "$GITHUB_OUTPUT"

  # ── Job 1: Build Apple Silicon DMG ───────────────────────────
  build:
    needs: validate-release-branch
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest   # Apple Silicon (M-series), Rosetta 2 covers Intel Macs
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || needs.validate-release-branch.outputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Sync version from release tag into all first-party manifests before building.
      # This ensures the built app/CLI version matches the GitHub release tag.
      - name: Sync version from tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            V="${{ github.event.inputs.version }}"
            TAG="v${V#v}"
          fi
          node scripts/sync-version.js "$TAG"

      - name: Install frontend dependencies
        run: npm install

      # release event → attach DMG to the release created via GitHub UI
      - name: Build and attach to GitHub release
        if: github.event_name == 'release'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ github.event.release.id }}
          args: --target ${{ matrix.target }}

      # workflow_dispatch → create a new release programmatically
      - name: Resolve tag name
        id: ver
        if: github.event_name == 'workflow_dispatch'
        run: |
          V="${{ github.event.inputs.version }}"
          echo "tag=v${V#v}" >> "$GITHUB_OUTPUT"

      - name: Build and create release
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.ver.outputs.tag }}
          releaseName: 'BitPet ${{ steps.ver.outputs.tag }}'
          releaseBody: |
            Install or update via npm:
            ```bash
            npm install -g bitpet   # first install
            npm update -g bitpet    # update
            ```
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  # ── Job 2: Publish CLI to npm (independent of DMG builds) ──
  publish-npm:
    needs: [validate-release-branch]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || needs.validate-release-branch.outputs.ref }}

      - name: Setup Node.js with npm registry
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Sync version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            V="${{ github.event.inputs.version }}"
            TAG="v${V#v}"
          fi
          VER="${TAG#v}"
          node scripts/sync-version.js "$TAG"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Verify npm token is configured
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Missing NPM_TOKEN repository secret"
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Check npm version availability
        working-directory: cli
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION="${{ steps.version.outputs.version }}"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION already exists on npm. Bump the release version before publishing."
            exit 1
          fi

      - name: Verify CLI package
        working-directory: cli
        run: |
          npm test
          npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
