name: Release

on:
  # Triggered when a release is created via the GitHub UI ("Draft a new release").
  # Builds DMG files and attaches them to that release automatically.
  release:
    types: [created]

  # Manual fallback: trigger from the Actions tab without creating a release first.
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.1.1），留空则使用 package.json 版本'
        required: false
        default: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest   # Apple Silicon (M-series)
            target: aarch64-apple-darwin
          - os: macos-13       # Intel
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      # ── Path 1: release event → attach DMG to the release created via GitHub UI ──
      - name: Build and attach to GitHub release
        if: github.event_name == 'release'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ github.event.release.id }}
          args: --target ${{ matrix.target }}

      # ── Path 2: workflow_dispatch → create a new release programmatically ──
      - name: Resolve version
        id: ver
        if: github.event_name == 'workflow_dispatch'
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V=$(node -p "require('./package.json').version")
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"

      - name: Build and create release
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.ver.outputs.tag }}
          releaseName: 'BitPet ${{ steps.ver.outputs.tag }}'
          releaseBody: |
            ## 下载

            | 文件 | 适用机型 |
            |---|---|
            | `BitPet_*_aarch64.dmg` | Apple Silicon（M1/M2/M3/M4） |
            | `BitPet_*_x64.dmg` | Intel Mac |

            ## 安装

            1. 下载对应 DMG，打开后将 BitPet.app 拖入 Applications
            2. 安装 CLI：
            ```bash
            cd bitpet/cli && npm install -g .
            bitpet init
            ```

            首次打开若提示"无法验证开发者"：右键 BitPet.app → 打开 → 打开。
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
