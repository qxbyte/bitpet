name: Release

on:
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.0.5），留空则使用 package.json 版本'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # ── Job 1: Build DMG for each architecture ───────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest   # Apple Silicon (M-series)
            target: aarch64-apple-darwin
          - os: macos-13       # Intel
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Sync version from release tag into all config files before building.
      # This ensures the built app/CLI version matches the GitHub release tag.
      - name: Sync version from tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            V="${{ github.event.inputs.version }}"
            [ -z "$V" ] && V=$(node -p "require('./package.json').version")
            TAG="v${V}"
          fi
          VER="${TAG#v}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            pkg.version = '${VER}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          node scripts/sync-version.js

      - name: Install frontend dependencies
        run: npm install

      # release event → attach DMG to the release created via GitHub UI
      - name: Build and attach to GitHub release
        if: github.event_name == 'release'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ github.event.release.id }}
          args: --target ${{ matrix.target }}

      # workflow_dispatch → create a new release programmatically
      - name: Resolve tag name
        id: ver
        if: github.event_name == 'workflow_dispatch'
        run: |
          V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V=$(node -p "require('./package.json').version")
          echo "tag=v${V}" >> "$GITHUB_OUTPUT"

      - name: Build and create release
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.ver.outputs.tag }}
          releaseName: 'BitPet ${{ steps.ver.outputs.tag }}'
          releaseBody: |
            Install or update via npm:
            ```bash
            npm install -g bitpet   # first install
            npm update -g bitpet    # update
            ```
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

  # ── Job 2: Publish CLI to npm (runs after all DMGs are uploaded) ──
  publish-npm:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup Node.js with npm registry
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Sync version from tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            V="${{ github.event.inputs.version }}"
            [ -z "$V" ] && V=$(node -p "require('./package.json').version")
            TAG="v${V}"
          fi
          VER="${TAG#v}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json'));
            pkg.version = '${VER}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          node scripts/sync-version.js

      - name: Publish to npm
        run: npm publish --access public
        working-directory: cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
