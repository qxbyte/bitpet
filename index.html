<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BitPet</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 110px;
      height: 150px;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    #app {
      width: 110px;
      height: 150px;
      position: relative;
      cursor: pointer;
    }

    #pet-canvas {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      background: transparent;
    }

    #loading {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: radial-gradient(circle, #E87C35 40%, #B85A10 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50%       { transform: translateX(-50%) scale(1.08); }
    }

    #bubble {
      position: absolute;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 104px;
      min-height: 28px;
      background: #1a1a2e;
      border: 2px solid #E87C35;
      border-radius: 6px;
      color: #ffe8d0;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      line-height: 1.4;
      padding: 4px 6px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
      word-break: break-word;
      box-shadow: 0 0 6px rgba(232,124,53,0.4);
    }

    #bubble.visible { opacity: 1; }

    #bubble .session-header {
      color: #FFD700;
      font-size: 8px;
      margin-bottom: 2px;
      border-bottom: 1px solid #B85A10;
      padding-bottom: 2px;
    }

    #bubble::after {
      content: '';
      position: absolute;
      bottom: -7px;
      left: 50%;
      transform: translateX(-50%);
      border: 4px solid transparent;
      border-top-color: #E87C35;
    }

    #context-menu {
      display: none;
      position: fixed;
      background: #1a1a2e;
      border: 1px solid #E87C35;
      border-radius: 4px;
      z-index: 9999;
      min-width: 80px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .ctx-item {
      padding: 5px 10px;
      cursor: pointer;
      color: #ffe8d0;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      white-space: nowrap;
    }

    .ctx-item:hover {
      background: #E87C35;
      color: #1a1a2e;
    }

  </style>
</head>
<body>
  <div id="app">
    <div id="bubble">
      <div class="session-header" id="session-header"></div>
      <span id="bubble-text"></span>
    </div>
    <div id="loading">🐾</div>
    <canvas id="pet-canvas" width="64" height="64" style="display:none"></canvas>
  </div>
  <div id="context-menu">
    <div class="ctx-item" id="menu-quit">退出</div>
  </div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
